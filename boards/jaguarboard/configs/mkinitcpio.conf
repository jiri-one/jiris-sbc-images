# Include storage for both the JaguarBoard and a virtual-machine boot check.
# Do not autodetect the build computer's hardware.
# Load Intel graphics before consolefont and the login prompt.
MODULES=(i915 mmc_block sdhci sdhci_acpi sdhci_pci usb_storage uas xhci_pci ehci_pci usbhid hid_generic ext4 virtio_pci virtio_blk)
BINARIES=()
FILES=()
HOOKS=(base udev microcode modconf keyboard jaguar-consolefont block filesystems fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3)
