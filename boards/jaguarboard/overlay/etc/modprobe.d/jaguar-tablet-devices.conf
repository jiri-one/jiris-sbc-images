# Legacy firmware enumerates nonresponding tablet devices on JaguarBoard v1.3.
# Stop their automatic probes; USB/HDMI audio and I2C/GPIO controllers stay enabled.
# Remove this file and rebuild the initramfs to retry them on different hardware.
blacklist snd_soc_rt5640
blacklist snd_soc_rt5645
blacklist snd_soc_rt5651
blacklist snd_soc_rt5670
blacklist snd_soc_sst_bytcr_rt5640
blacklist max17042_battery
blacklist i2c_hid_acpi
