# i915 briefly replaces the EFI framebuffer with a dummy console. A setup
# attempt in that interval fails with EIO; retry after the framebuffer returns.
[Unit]
StartLimitIntervalSec=30s
StartLimitBurst=5

[Service]
# Unlike systemd-vconsole-setup, setfont fails when a dummy console has no font
# support. Preload the bundled font, then let the normal setup apply vconsole.conf.
ExecStartPre=/usr/bin/setfont -C /dev/tty1 latarcyrheb-sun32
Restart=on-failure
RestartSec=2s
