# Build on a foreign host: autodetect would select the host's hardware.
# The block hook includes MMC and NVMe drivers; keep the full module selection.
MODULES=(mmc_block phy_rockchip_naneng_combphy rockchipdrm)
BINARIES=(/usr/bin/bash /usr/bin/kbd_mode /usr/bin/stty)
FILES=(/usr/local/sbin/odroid-m1s-vconsole /etc/systemd/system/systemd-vconsole-setup.service.d/m1s-tall-font.conf)
HOOKS=(base systemd modconf keyboard sd-vconsole block filesystems fsck)
COMPRESSION="zstd"
