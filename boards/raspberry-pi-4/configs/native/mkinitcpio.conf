# Cross-build with explicit Pi 4 boot providers; do not autodetect the host.
# Keep SD/USB storage, ext4/FAT, native DRM and QEMU virtio available early.
MODULES=(
    bcm2835_mailbox raspberrypi clk_raspberrypi gpio_raspberrypi_exp reset_raspberrypi
    mmc_block sdhci_iproc sdhci_brcmstb bcm2835 pcie_brcmstb
    xhci_pci usb_storage uas sd_mod ext4 vfat nls_cp437 nls_iso8859_1
    genet broadcom bcm2835_dma i2c_brcmstb vc4 v3d
    raspberrypi_cpufreq cpufreq_dt nvmem_rmem
    virtio_pci virtio_blk virtio_net virtio_rng
)
BINARIES=()
FILES=()
HOOKS=(base systemd modconf keyboard sd-vconsole rpi4-consolefont fsck)
COMPRESSION="zstd"
