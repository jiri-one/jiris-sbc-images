# Build on a foreign host: autodetect would select that host's hardware.
# List Pi 4 SD/USB, ext4/FAT and QEMU virtio boot providers explicitly instead
# of including unrelated controllers and filesystems through the broad hooks.
# These explicit modules exist (or are built in) in the Ports kernel. GENET
# and its PHY are loaded early so basic wired recovery is also possible.
# UEFI creates a platform framebuffer; simpledrm lacks that modalias in this
# kernel, so load it explicitly before sd-vconsole to keep HDMI output.
# Include the firmware mailbox, clocks and CPU frequency providers needed
# by the optional EDK2 Device Tree path alongside the ACPI storage drivers.
MODULES=(
    mmc_block sdhci_acpi sdhci_iproc sdhci_brcmstb bcm2835 pcie_brcmstb
    xhci_pci usb_storage uas genet broadcom simpledrm
    bcm2835_mailbox raspberrypi gpio_raspberrypi_exp clk_raspberrypi
    raspberrypi_cpufreq cpufreq_dt nvmem_rmem
    reset_raspberrypi sd_mod ext4 vfat nls_cp437 nls_iso8859_1
    virtio_pci virtio_blk virtio_net virtio_rng
)
BINARIES=()
FILES=()
HOOKS=(base systemd modconf keyboard sd-vconsole rpi4-consolefont fsck)
COMPRESSION="zstd"
