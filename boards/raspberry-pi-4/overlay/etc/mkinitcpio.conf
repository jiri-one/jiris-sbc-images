# Build on a foreign host: autodetect would select that host's hardware.
# block includes all MMC/USB/PCIe and virtio storage drivers and dependencies.
# These explicit modules exist (or are built in) in the Ports kernel. GENET
# and its PHY are loaded early so basic wired recovery is also possible.
MODULES=(mmc_block sdhci_acpi sdhci_iproc sdhci_brcmstb bcm2835 pcie_brcmstb xhci_pci usb_storage uas genet broadcom)
BINARIES=()
FILES=()
HOOKS=(base systemd modconf keyboard sd-vconsole block filesystems fsck)
COMPRESSION="zstd"
